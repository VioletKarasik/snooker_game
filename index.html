<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Snooker App - Graphics Programming</title>

  <script src="libraries/p5.min.js" type="text/javascript"></script>
  <script src="libraries/p5.sound.min.js" type="text/javascript"></script>
  <script src="libraries/matter.js" type="text/javascript"></script>

  <style>
    /* Убираем margin/padding у body, ставим фон стола */
    body {
      margin: 0;
      padding: 0;
      background-color: #4a0b27; /* зелёный цвет стола */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Контейнер для приветствия */
    #welcome {
      margin-top: 20px;
      margin-bottom: 10px;
      text-align: center;
      max-width: 700px;
    }

    /* Кнопка старта (пример) */
    #startBtn {
      margin-top: 10px;
      background-color: #184d18;
      border: none;
      color: #cfc;
      padding: 8px 18px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #startBtn:hover {
      background-color: #2ea32e;
    }

    /* Canvas центрируем и задаём фиксированный фон */
    canvas {
      display: block;
      background-color: transparent; /* Убираем зеленый фон у canvas */
      margin-bottom: 30px;
      /* Высота будет зависеть от кода, но margin нужен для отступа снизу */
    }
  </style>

  <!-- Твои скрипты -->
  <script src="js/physics.js" type="text/javascript"></script>
  <script src="js/table.js" type="text/javascript"></script>
  <script src="js/balls.js" type="text/javascript"></script>
  <script src="js/cue.js" type="text/javascript"></script>
  <script src="js/sketch.js" type="text/javascript"></script>

</head>
<body>

  <div id="welcome">
    <h1>Добро пожаловать в Snooker App 🎱</h1>
    <p>Правила просты: забей все шары в лузы, используя кий. Наслаждайся игрой!</p>
    <button id="startBtn">Начать игру</button>
  </div>

</body>
</html>
