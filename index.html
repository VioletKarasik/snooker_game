<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Snooker App - Graphics Programming</title>

  <script src="libraries/p5.min.js"></script>
  <script src="libraries/p5.sound.min.js"></script>
  <script src="libraries/matter.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4a0b27;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #welcome {
      margin-top: 20px;
      margin-bottom: 10px;
      text-align: center;
      max-width: 700px;
    }

    #startBtn {
      margin-top: 10px;
      background-color: #184d18;
      border: none;
      color: #cfc;
      padding: 8px 18px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #startBtn:hover {
      background-color: #2ea32e;
    }

    canvas {
      display: block;
      background-color: transparent;
      margin-bottom: 30px;
    }
  </style>

  <script src="js/physics.js"></script>
  <script src="js/table.js"></script>
  <script src="js/balls.js"></script>
  <script src="js/cue.js"></script>
  <script src="js/sketch.js"></script>
</head>
<body>

  <div id="welcome">
    <h1>Добро пожаловать в Snooker App 🎱</h1>
    <p>Правила просты: забей все шары в лузы, используя кий. Наслаждайся игрой!</p>
    <button id="startBtn">Начать игру</button>
  </div>

</body>
</html>
